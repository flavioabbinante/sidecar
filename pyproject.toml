[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sidecar-tv"
version = "0.1.0"
description = "Inspect and quiet a VIDAA smart TV from your own LAN"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
sidecar = "sidecar.cli:main"

[tool.setuptools]
packages = ["sidecar"]

[tool.setuptools.package-data]
sidecar = ["static/*.html"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S104"]  # binding 0.0.0.0 is the point: the TV reaches us over the LAN

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"sidecar/web.py" = ["S603", "S607"]  # fixed openssl command, no user input in argv

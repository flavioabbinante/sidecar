name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        sidecar is read-only and dependency-free on purpose (see [GOVERNANCE.md](https://github.com/flavioabbinante/sidecar/blob/main/GOVERNANCE.md)).
        Requests that need installing apps, writing to the TV or adding dependencies will be declined.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation, not the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like sidecar to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried instead?
  - type: checkboxes
    id: help
    attributes:
      label: Can you help?
      options:
        - label: I'd like to work on this myself
